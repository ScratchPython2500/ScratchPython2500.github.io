<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - 页面未找到</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      font-family: "WenQuanYi Micro Hei", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: #fff;
      overflow: hidden;
    }
    .container {
      text-align: center;
      padding: 40px 24px;
      position: relative;
      z-index: 2;
    }
    .error-code {
      font-size: 180px;
      font-weight: 900;
      line-height: 1;
      background: linear-gradient(135deg, #f7971e, #ffd200);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-fill-color: transparent;
      text-shadow: 0 10px 40px rgba(255, 210, 0, 0.25);
    }
    .title {
      font-size: 28px;
      font-weight: 700;
      margin-top: 12px;
      letter-spacing: 2px;
    }
    .desc {
      font-size: 15px;
      color: rgba(255,255,255,0.7);
      margin: 18px auto 32px;
      max-width: 460px;
      line-height: 1.7;
    }
    .btn {
      display: inline-block;
      padding: 13px 34px;
      border-radius: 50px;
      background: linear-gradient(135deg, #f7971e, #ffd200);
      color: #302b63;
      font-weight: 700;
      font-size: 15px;
      text-decoration: none;
      transition: transform .2s, box-shadow .2s;
      box-shadow: 0 8px 24px rgba(255, 210, 0, 0.3);
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(255, 210, 0, 0.45);
    }
    /* 背景漂浮圆点 */
    .bg-shape {
      position: fixed;
      border-radius: 50%;
      background: rgba(255,255,255,0.06);
      animation: float 18s infinite;
      z-index: 1;
    }
    .s1 { width: 220px; height: 220px; left: -60px; top: -60px; }
    .s2 { width: 320px; height: 320px; right: -100px; bottom: -120px; animation-delay: -6s; }
    .s3 { width: 140px; height: 140px; left: 60%; top: -40px; animation-delay: -10s; }
    @keyframes float {
      0%,100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(40px) scale(1.08); }
    }
    @media (max-width: 600px) {
      .error-code { font-size: 120px; }
      .title { font-size: 22px; }
      .desc { font-size: 14px; }
    }
  </style>
</head>
<body>
  <div class="bg-shape s1"></div>
  <div class="bg-shape s2"></div>
  <div class="bg-shape s3"></div>
  <div class="container">
    <div class="error-code">404</div>
    <div class="title">抱歉，页面走丢了</div>
    <p class="desc">你访问的页面可能已被删除、名称已更改，或暂时不可用。别担心，我们可以从首页重新开始。</p>
    <a class="btn" href="/">返回首页</a>
  </div>
</body>
</html>
